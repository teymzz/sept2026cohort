<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            padding: 2em;
        }
        #outputField{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .section {
            padding: 1em;
            font-size: 14px;
            color: white;
            background-color: red;
        }
    </style>
</head>
<body>

    <input type="text" id="num1">
    <input type="text" id="num2">
    <button onclick="generate()">Generate</button>

    <div id="outputField"></div>
    
</body>
<script>


        // console.log(isNaN('')); //  +'' ..............false
        // console.log(isNaN('abc'));// +'abc' ...true
        // console.log(isNaN('  ')); // +' ' ............false
        // console.log(isNaN(2)); // +2 ...............false
        // console.log(isNaN('2')); // +2 ............false

        //  // '                      0 '
        // '' // falsy
        // '0' // truthy 
        // 0 // falsy 

    let numField1 = document.getElementById('num1');
    let numField2 = document.getElementById('num2');
    
    let outputField = document.getElementById('outputField')

    function generate(){
        num1Value = numField1.value.trim(); 
        num2Value = numField2.value.trim(); 

        // if(!num1Value || !num2Value){
        //     alert('All field are required')
        // }
        
        if(!num1Value){
            alert('Please enter a valid number in field 1')
        }else if(!num2Value){
            alert('Please enter a valid number in field 2')
        }else{

            if(isNaN(num1Value)){
                alert('Please enter a valid number in field 1')
            }else if(isNaN(num2Value)){
                alert('Please enter a valid number in field 2')
            }else{
                num1Value = +num1Value; 
                num2Value = +num2Value; 
                let output = '';

                if(num1Value > num2Value){

                    for(let indexi = num1Value; indexi >= num2Value; indexi--){

                        output += `<div class='section'><h1>${indexi} Times Table</h1>`
                        for (let index = 1; index <= 12; index++) {
                                output += (`${indexi} * ${index} = ${indexi * index} <br>`); 
                        }
                        output += '</div>'
                    }
                    outputField.innerHTML = output

                }else{
                    
                    for(let indexi = num1Value; indexi <= num2Value; indexi++){

                        output += `<div class='section'><h1>${indexi} Times Table</h1>`
                        for (let index = 1; index <= 12; index++) {
                                output += (`${indexi} * ${index} = ${indexi * index} <br>`); 
                        }
                        output += '</div>'
                    }
                    outputField.innerHTML = output
                }

            }

        }
        
        


    }
    // let number = 3;



    
</script>
</html>
