let object3 = {
    'name' : 'Ade',
    'age': 20,
    'school': 'sqi',
    'phone': 23456789,
    'color': 'black',
    'gender': 'Male',
    'height': 'tall',
    'hobbies': ['watch movies','play game']
}

let keysOfObject = Object.keys(object3)
let valuesOfObject = Object.values(object3)

console.log(keysOfObject);
console.log(valuesOfObject);
console.log(keysOfObject);
console.log(Object.keys(object3).length);

let objectKeys = Object.keys(object3)
let lengthOfObject = objectKeys.length;


console.log(objectKeys);


for(let i=0; i<lengthOfObject; i++){
    let key = objectKeys[i]
    let value = object3[key]
  
    if(typeof value === 'string' ){
        object3[key] = value.toUpperCase()
    }else if(Array.isArray(value)){
            for(let i =0; i < value.length; i++){
                if(typeof (value[i]) === 'string'){
                    object3[key][i] = value[i].toUpperCase()
                }
            }
    }
    
}

console.log(object3);


for(let key in object3){
    let value = object3[key];
    console.log(key, value);
}
