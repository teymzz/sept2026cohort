<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" id="num1">
    <input type="text" id="num2">
    <button onclick="submit()">Submit</button>
    
</body>
<script>

    let numField1 = document.getElementById('num1')
    let numField2 = document.getElementById('num2')

    function submit() {

        let num1 = numField1.value.trim();
        let num2 = numField2.value.trim();

        if(num1 > num2){
            console.log(`${num1} is greater than ${num2}`);
        }
        if(num1 < num2){
            console.log(`${num1} is lesser than ${num2}`);
        }



    }

</script>
</html>
