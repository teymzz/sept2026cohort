<body>

    <input id="num1"> 
    <input id="num2"> 
    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">-</button>
    <button onclick="calculate('*')">*</button>
    <button onclick="calculate('/')">/</button>
    
</body>

<script>


function calculate(operator){

    if(operator === '+'){
        console.log(+num1.value + +num2.value);
    }else if(operator === '-'){
        console.log(+num1.value - +num2.value);
    }else if(operator === '*'){
        console.log(+num1.value * +num2.value)
    }else{
        console.log(+num1.value / +num2.value)
    }
}
