<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" id="sentence">
    <button onclick="splitWords()">split word</button>

    <div id="output"></div>
    
</body>


<script>

    let inputField = document.getElementById('sentence')
    
    function  splitWords() {
        let sentence = inputField.value.trim()// ''
        sentence = sentence.split(' ');

        document.getElementById('output').innerHTML = sentence
        
    }

</script>

</html>
