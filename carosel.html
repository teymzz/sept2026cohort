<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .slides{
            width: 100vw;
            height: 100vh;
            padding: 1em;
            .slide{
                width: 100%;
                height: 100%;
                background-color: yellow;
            }
        }

    </style>
</head>
<body>

    <div class="slides" id="slideBox"></div>
    <button onclick="prev()">Prev</button>
    <button onclick="next()">Next</button>
    
</body>
</html>

<script>

    let bgColors = ['red','green','blue','yellow','orange']
    let bgImages = ['ade.jpg','green','blue','yellow','orange']
    let slideBox =  document.getElementById('slideBox');

    let firstIndex = 0;

    slideBox.innerHTML =   `<div class="slide" style="background-color: ${bgColors[firstIndex]}"></div>`


    function prev(){
        firstIndex--;
        if(firstIndex < 0) firstIndex = bgColors.length - 1
        console.log(firstIndex);
        slideBox.innerHTML =   `<div class="slide" style="background-color: ${bgColors[firstIndex]}"></div>`
    }

    function next() {
        firstIndex++;
        if(firstIndex === bgColors.length) firstIndex = 0;
        slideBox.innerHTML =   `<div class="slide" style="background-color: ${bgColors[firstIndex]}"></div>`
    }


</script>
